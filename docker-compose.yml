services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vessel_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in an operator-owned environment file}
      POSTGRES_DB: vessel_tracking
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vessel_user -d vessel_tracking"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
